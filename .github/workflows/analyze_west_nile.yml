name: Analisi Fonti Campione West Nile

on:
  workflow_dispatch: {}

jobs:
  analyze_west_nile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Esegui analisi e conteggio fonti West Nile
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/analyze_west_nile_sources.py
