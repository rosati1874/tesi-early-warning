name: Monitoraggio periodico

on:
  schedule:
    # una volta al giorno, frequenza più bassa dell'acquisizione (Cap. 4.6)
    - cron: "30 4 * * *"
  workflow_dispatch: {}

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui pipeline di monitoraggio
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.pipeline.run_monitoring
