name: Marcatura Duplicati Storici (una tantum)

on:
  workflow_dispatch: {}

jobs:
  mark_duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa dipendenze
        run: pip install -r requirements.txt
      - name: Esegui marcatura duplicati storici (--execute)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/mark_historical_duplicates.py --execute
