name: Test Manuale Standardizzazione Disease Gemini

on:
  workflow_dispatch: {}

jobs:
  test_disease_formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui test live standardizzazione disease Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/test_live_disease_formatting.py
