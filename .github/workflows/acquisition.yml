name: Acquisizione contenuti

on:
  schedule:
    # ogni 6 ore (UTC) - tarare in base ai limiti di quota osservati
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # permette anche l'avvio manuale da GitHub

jobs:
  acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui pipeline di acquisizione
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ENABLE_LLM_CLASSIFICATION: ${{ vars.ENABLE_LLM_CLASSIFICATION }}
          ENABLE_WEBHOOK_NOTIFICATIONS: ${{ vars.ENABLE_WEBHOOK_NOTIFICATIONS }}
          ENABLE_EMAIL_NOTIFICATIONS: ${{ vars.ENABLE_EMAIL_NOTIFICATIONS }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m src.pipeline.run_acquisition
